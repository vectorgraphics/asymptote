name: initialize-env
description: Initialize environment
runs:
  using: 'composite'
  steps:
    - name: Update apt
      shell: bash
      run: sudo apt-get update
    - name: Install ninja
      shell: bash
      run: sudo apt-get install ninja-build
    - name: Setup build dependencies
      shell: bash
      run: |
        sudo apt-get install \
          libxinerama-dev libxcursor-dev xorg-dev \
          libglu1-mesa-dev pkg-config libwayland-dev autopoint
        # Autotools, for vcpkg ports that run autoreconf as part of their build.
        # Nothing we depend on directly needs them; libxcrypt does, and it is
        # pulled in transitively through default features that are on by default
        # on Linux:
        #   vulkan-sdk-components -> sdl2 -[dbus]-> dbus -[systemd]-> libsystemd
        #     -> libxcrypt
        # vcpkg's vcpkg_run_autoreconf aborts the port build when any of these is
        # absent; the ubuntu-22.04 image ships every one except autoconf-archive.
        # Its error message always names all four regardless of which is missing,
        # so install the set -- which also matches .devcontainer/Dockerfile, so
        # the container and CI cannot drift apart here.
        sudo apt-get install -y autoconf autoconf-archive automake libtool
        sudo apt-get install ccache
    - name: Set environment variables
      shell: bash
      run: |
        echo VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
        echo CCACHE_DIR=/home/runner/.ccache >> "$GITHUB_ENV"
        echo CCACHE_TEMP_DIR=/home/runner/.ccache >> "$GITHUB_ENV"
        echo CCACHE_MAXSIZE=1G >> "$GITHUB_ENV"
    - name: Cache Vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: /home/runner/.cache/vcpkg/archives
        # Key on the manifest so new/changed dependencies get re-cached; the
        # restore-keys prefix falls back to the most recent compatible cache.
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-
    - name: Cache ccache
      id: cache-ccache
      uses: actions/cache@v4
      with:
        path: /home/runner/.ccache
        # The key must be unique per commit *and* per job. github.sha refreshes
        # the cache whenever code changes (avoiding unbounded cache growth from a
        # per-run key). github.job keeps jobs from colliding: this composite
        # action runs in several Linux jobs, and an earlier job (e.g. configure)
        # finishing first would otherwise claim the key and make the main build
        # job's post-step skip saving its richer cache.
        key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.job }}-
          ${{ runner.os }}-ccache-
