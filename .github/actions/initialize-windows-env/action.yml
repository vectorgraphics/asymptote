name: initialize-env
description: Initialize environment
inputs:
  vcpkg-cache:
    description: >
      Restore the vcpkg cache. Pass 'false' in a job that never runs vcpkg
      install.
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Install ninja
      shell: pwsh
      run: choco install ninja -y

    - uses: ./.github/actions/vcpkg-cache-restore
      if: inputs.vcpkg-cache == 'true'
