# Static type checking for the non-GUI Python helper scripts.
#
# Unlike black/isort/pylint, which CI runs over every changed lintable file,
# mypy runs over the explicit allowlist below.  Two reasons:
#
#  * mypy is a whole-program analysis, so feeding it only the files a pull
#    request happened to touch makes sibling imports resolve to Any (or fail
#    outright) and the result depends on the shape of the diff.
#  * most of the ~74 lintable scripts predate any annotation effort.  An
#    allowlist lets them be adopted one at a time instead of demanding a flag
#    day; adding a file here is the whole onboarding step.
#
# python_version is the floor the scripts must run on, not the version CI
# happens to provide.  Some builders deliberately build on old software so the
# result runs on old software, so 3.7 is a real constraint; keep it in sync
# with PY3_MINIMUM_VERSION in cmake-scripts/options.cmake.
#
# This setting is the *only* mechanical check of the stdlib half of that floor.
# pylint's py-version drives syntax and language-feature checks but not stdlib
# availability: it passes code calling math.lcm (3.9), str.removeprefix (3.9)
# or shutil.copytree(dirs_exist_ok=) (3.8) without complaint.  mypy at 3.7
# rejects all three -- which is what copy_base_into's hand-avoidance of
# dirs_exist_ok relies on being caught if anyone reaches for it again.
#
# The mypy pin in requirements-dev.txt is coupled to this value: 1.8.x is the
# last release able to target 3.7 (1.9 raised its minimum to 3.8, 2.x to 3.10).
# Bumping mypy without raising this floor fails with "Python 3.7 is not
# supported"; the two move together or not at all.

[mypy]
# Comma-separated (a newline alone does not split the list: mypy would take the
# whole block as one filename).
files =
    findsym.py,
    generate_enums.py,
    tests/test_collections_errors.py,
    tests/test_executable_path.py,
    tests/test_relocatable.py

python_version = 3.7

# Bodies of unannotated functions are not checked.  This is mypy's default,
# but state it: it is the property the allowlist strategy depends on, so it
# should not change silently under a version bump.
check_untyped_defs = False

# Once a file is on the allowlist, hold it to a real standard.
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
no_implicit_optional = True
strict_equality = True
